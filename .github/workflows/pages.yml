# Deploys the site to GitHub Pages on every push to the default branch.
# First run enables Pages for the repository. Custom domain is set in
# Settings → Pages once DNS points at GitHub.
name: Deploy to GitHub Pages

# Manual only. Switch back to a push trigger if the site is hosted on GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
